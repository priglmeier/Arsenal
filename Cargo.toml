[package]
name = "arsenal"
version = "0.10.14"
edition = "2021"
description = "Arsenal - Arma Reforger Server Launcher"
license = "MIT"
readme = "README.md"

[dependencies]
# GUI. egui_dock 0.12 is the release that matches egui 0.27.
eframe = "0.27.2"
egui = "0.27.2"
egui_dock = { version = "0.12", features = ["serde"] }

# JSON. preserve_order keeps unknown keys in their original order when saving.
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

# CPU and RAM readings for the Metrics tab (Windows and Linux).
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

# Reads the Workshop scenario list of each enabled mod.
ureq = "2"

anyhow = "1.0"
chrono = "0.4"
directories = "5"
rfd = "0.14"
